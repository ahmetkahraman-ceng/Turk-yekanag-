name: turkiye_kan_agi
description: "Türkiye Kan Ağı — Kan ihtiyacı olan kişilerle yakındaki uyumlu gönüllü bağışçıları buluşturan uygulama."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.6.2

  # Models & Serialization
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Firebase
  firebase_core: ^3.8.1
  firebase_auth: ^5.3.4
  cloud_firestore: ^5.5.1
  firebase_messaging: ^15.1.6
  cloud_functions: ^5.2.0
  firebase_storage: ^12.3.7
  firebase_remote_config: ^5.2.0
  firebase_crashlytics: ^4.2.0
  firebase_analytics: ^11.3.6
  firebase_app_check: ^0.3.1+7

  # Location & Maps
  geolocator: ^13.0.2
  geocoding: ^3.0.0
  google_maps_flutter: ^2.10.0
  geoflutterfire_plus: ^0.0.32

  # Network & Device Info
  connectivity_plus: ^6.1.1
  package_info_plus: ^8.1.2
  flutter_local_notifications: ^22.3.3
  timezone: ^0.11.2
  add_2_calendar: ^3.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.4
  build_runner: ^2.4.13
  riverpod_generator: ^2.6.3
  freezed: ^2.5.7
  json_serializable: ^6.9.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/data/turkey_provinces_districts.json
    - assets/data/turkey_hospitals.json
    - assets/data/eligibility_survey.json
